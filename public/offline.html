<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · Forgeline</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f5; color: #1a1c1e; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #e8eaed; } }
      main { max-width: 420px; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #5f6368; line-height: 1.5; }
      @media (prefers-color-scheme: dark) { p { color: #9aa0a6; } }
      button { font: inherit; padding: 10px 20px; border-radius: 8px; border: none; background: #0d9488; color: #fff; cursor: pointer; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Forgeline couldn't reach the network. Pages you've already visited are available — use the back button, or retry when you're back online. Your progress is stored in this browser and safe.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
